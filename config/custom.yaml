template:
  source:
    name: Aethersailor Custom_Clash_Full
    upstream_url: https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/refs/heads/main/cfg/Custom_Clash_Full.ini
    file: Custom_Clash_Full.ini
  output: Custom_Clash_Full_Plus.ini

  provider_urls:
    upstream_base: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/
    publish_base: https://raw.githubusercontent.com/GeekXtop/Custom_OpenClash_Subconverter_Rules/publish/rules/

  insertions:
    - position: before
      anchor: ruleset=🛒 国外电商,[]GEOSITE,category-ecommerce
      lines:
        - ;Crypto 外部补充规则
        - ruleset=🪙 Crypto,clash-domain:https://raw.githubusercontent.com/GeekXtop/Custom_OpenClash_Subconverter_Rules/publish/rules/External_Crypto_Domain.yaml,28800
        - ruleset=🪙 Crypto,[]GEOSITE,category-cryptocurrency
    - position: after_prefix
      anchor: custom_proxy_group=🌎 国外媒体`
      lines:
        - custom_proxy_group=🪙 Crypto`select`[]🚀 手动选择`[]♻️ 自动选择`[]🇸🇬 新加坡节点`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇼🇸 台湾节点`[]🇰🇷 韩国节点`[]🇨🇦 加拿大节点`[]🇬🇧 英国节点`[]🇫🇷 法国节点`[]🇩🇪 德国节点`[]🇳🇱 荷兰节点`[]🇹🇷 土耳其节点`[]🇷🇺 俄罗斯节点`[]🌐 其他地区`[]🏠 家宽节点`[]🐢 低倍率节点`.*

rules:
  external_sources:
    - name: Aethersailor_Custom_Direct
      enabled: true
      url: https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Custom_Direct.list
      file: Aethersailor_Custom_Direct.list
    - name: Aethersailor_Custom_Proxy
      enabled: true
      url: https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Custom_Proxy.list
      file: Aethersailor_Custom_Proxy.list
    - name: Aethersailor_Steam_CDN
      enabled: true
      url: https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Steam_CDN.list
      file: Aethersailor_Steam_CDN.list
    - name: Aethersailor_Custom_Port_Direct
      enabled: true
      url: https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Custom_Port_Direct.yaml
      file: Aethersailor_Custom_Port_Direct.yaml
    - name: ACL4SSR_Crypto
      enabled: true
      url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Crypto.list
      file: ACL4SSR_Crypto.list
    - name: Dler_Crypto
      enabled: true
      url: https://raw.githubusercontent.com/dler-io/Rules/main/Clash/Provider/Crypto.yaml
      file: Dler_Crypto.yaml

  remove:
    - remove.list

  rulesets:
    - name: Custom_Direct
      sources:
        - external: Aethersailor_Custom_Direct.list
        - local: Custom_Direct.list
      outputs:
        domain:
          file: Custom_Direct_Domain.yaml
          replaces: Custom_Direct_Domain.yaml
        classical:
          file: Custom_Direct_Classical.yaml
          replaces: Custom_Direct_Classical_IP.yaml

    - name: Custom_Proxy
      sources:
        - external: Aethersailor_Custom_Proxy.list
        - local: Custom_Proxy.list
      outputs:
        domain:
          file: Custom_Proxy_Domain.yaml
          replaces: Custom_Proxy_Domain.yaml
        classical:
          file: Custom_Proxy_Classical.yaml
          replaces: Custom_Proxy_Classical_IP.yaml

    - name: Custom_Crypto
      sources:
        - local: Custom_Crypto.list
      outputs:
        domain:
          file: Custom_Crypto_Domain.yaml

    - name: Steam_CDN
      sources:
        - external: Aethersailor_Steam_CDN.list
      outputs:
        domain:
          file: Steam_CDN_Domain.yaml
        classical:
          file: Steam_CDN_Classical.yaml
          replaces: Steam_CDN_Classical.yaml

    - name: Custom_Port_Direct
      sources:
        - external: Aethersailor_Custom_Port_Direct.yaml
      outputs:
        classical:
          file: Custom_Port_Direct.yaml
          replaces: Custom_Port_Direct.yaml

    - name: External_Crypto
      sources:
        - external: ACL4SSR_Crypto.list
        - external: Dler_Crypto.yaml
      outputs:
        domain:
          file: External_Crypto_Domain.yaml
