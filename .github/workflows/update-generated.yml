name: Update Generated Files

on:
  push:
    paths:
      - "config/**"
      - "tools/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      commit_message:
        description: Commit message for generated updates
        required: false
        default: "chore: update generated rules and template"

permissions:
  contents: write

jobs:
  update-generated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Update generated files
        run: uv run python tools/update_all.py

      - name: Run tests
        run: uv run pytest

      - name: Publish generated files
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          publish_dir="$(mktemp -d)"
          cp -R rules templates "$publish_dir/"
          touch "$publish_dir/.nojekyll"

          git fetch origin publish || true
          if git show-ref --verify --quiet refs/remotes/origin/publish; then
            git checkout -B publish origin/publish
          else
            git checkout --orphan publish
          fi

          git rm -rf --ignore-unmatch .
          git clean -fdx
          cp -R "$publish_dir"/. .
          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No generated file changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "${COMMIT_MESSAGE:-chore: update generated rules and template}"
          git push origin publish
