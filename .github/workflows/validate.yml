name: Validate

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Run tests
        run: uv run pytest

      - name: Update generated files
        run: uv run python tools/update_all.py

      - name: Check generated files are committed
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --stat
            exit 1
          fi

      - name: Check whitespace
        run: git diff --check
