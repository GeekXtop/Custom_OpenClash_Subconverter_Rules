name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Run tests
        run: uv run pytest

      - name: Sync upstream template
        run: uv run python tools/sync_template.py

      - name: Regenerate template
        run: uv run python tools/generate_template.py

      - name: Sync external rules
        run: uv run python tools/sync_sources.py

      - name: Regenerate rules
        run: uv run python tools/generate_rules.py

      - name: Check generated files are committed
        run: git diff --exit-code

      - name: Check whitespace
        run: git diff --check
